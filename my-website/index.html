<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Streaming Site</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="js/home.js"></script>
</head>

<body>
  <div class="navbar">
    <img src="logo.png" alt="LOGO" />
    <div class="nav-links">
      <a href="index.html">Home</a>
      <select id="theme-select" class="theme-picker" onchange="changeTheme(this.value)">
        <option value="#e50914">Red Theme</option>
        <option value="#0071eb">Blue Theme</option>
        <option value="#800080">Purple Theme</option>
        <option value="#008000">Green Theme</option>
      </select>
      <button id="install-btn" class="install-btn" onclick="installPWA()">Install App</button>
      <input type="text" class="search-bar" placeholder="Search..." onfocus="openSearchModal()" />
    </div>
  </div>

  <div class="genre-filter-bar">
    <button class="genre-btn active" onclick="resetHomeView(this)">All</button>
    <button class="genre-btn" onclick="fetchByGenre(28, this)">Action</button>
    <button class="genre-btn" onclick="fetchByGenre(35, this)">Comedy</button>
    <button class="genre-btn" onclick="fetchByGenre(27, this)">Horror</button>
    <button class="genre-btn" onclick="fetchByGenre(878, this)">Sci-Fi</button>
  </div>

  <div class="banner" id="banner">
    <h1 id="banner-title"></h1>
  </div>

  <div class="row" id="continue-watching-row" style="display:none;">
    <h2>Continue Watching</h2>
    <div class="list" id="history-list"></div>
  </div>

  <div class="row">
    <h2 id="movies-title">Trending Movies</h2>
    <div class="list" id="movies-list"></div>
  </div>

  <div class="row" id="tvshows-row">
    <h2>Trending TV Shows</h2>
    <div class="list" id="tvshows-list"></div>
  </div>

  <div class="row" id="anime-row">
    <h2>Trending Anime</h2>
    <div class="list" id="anime-list"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div class="modal-body">
        <img id="modal-image" src="" alt="" />
        <div class="modal-text">
          <h2 id="modal-title"></h2>
          <div class="stars" id="modal-rating"></div>
          <p id="modal-description"></p>
        </div>
      </div>
      
      <div id="episode-selectors-container" class="episode-selectors" style="display:none;"></div>
      
      <iframe id="modal-video" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>

  <div class="search-modal" id="search-modal">
    <span class="close" onclick="closeSearchModal()">&times;</span>
    <input type="text" id="search-input" placeholder="Search for a movie or show..." oninput="handleSearchInput()" />
    <div class="results" id="search-results"></div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; <span id="copyright-year">2026</span> My Website. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Disclaimer</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
      </div>
    </div>
  </footer>
</body>
</html>
