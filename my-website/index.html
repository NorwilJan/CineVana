<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-left">
      <h1 class="logo">STREAMFLIX</h1>
      <button class="tab-btn active" onclick="filterContent('all', this)">Home</button>
      <button class="tab-btn" onclick="filterContent('movie', this)">Movies</button>
      <button class="tab-btn" onclick="filterContent('tv', this)">TV Shows</button>
      <button class="tab-btn" onclick="filterContent('anime', this)">Anime</button>
    </div>
    <div class="nav-right">
      <button class="search-icon-btn" onclick="openSearchModal()">🔍 Search</button>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header id="banner" class="banner">
    <div class="banner-content">
      <h1 id="banner-title">Loading...</h1>
      <div class="banner-buttons">
        <button class="play-btn" onclick="playBanner()">▶ Play</button>
      </div>
    </div>
  </header>

  <!-- Main Content Rows -->
  <main class="main-content">
    
    <!-- Continue Watching Row -->
    <section id="continue-row" class="content-row" style="display: none;">
      <h2>Continue Watching</h2>
      <div id="continue-list" class="row-slider"></div>
    </section>

    <!-- My List / Watchlist Row -->
    <section id="watchlist-row" class="content-row" style="display: none;">
      <h2>My List</h2>
      <div id="watchlist-list" class="row-slider"></div>
    </section>

    <!-- Genre Filter Bar -->
    <div class="genre-bar">
      <button class="genre-btn active" onclick="filterByGenre('all', this)">All Genres</button>
      <button class="genre-btn" onclick="filterByGenre('28', this)">Action</button>
      <button class="genre-btn" onclick="filterByGenre('35', this)">Comedy</button>
      <button class="genre-btn" onclick="filterByGenre('27', this)">Horror</button>
      <button class="genre-btn" onclick="filterByGenre('10749', this)">Romance</button>
      <button class="genre-btn" onclick="filterByGenre('18', this)">Drama</button>
    </div>

    <!-- Movies Row -->
    <section id="movies-row" class="content-row">
      <div class="row-header">
        <h2>Trending Movies</h2>
        <span class="see-all" onclick="openGridModal('movies')">See All</span>
      </div>
      <div id="movies-list" class="row-slider"></div>
    </section>

    <!-- TV Shows Row -->
    <section id="tvshows-row" class="content-row">
      <div class="row-header">
        <h2>Trending TV Shows</h2>
        <span class="see-all" onclick="openGridModal('tv')">See All</span>
      </div>
      <div id="tvshows-list" class="row-slider"></div>
    </section>

    <!-- Anime Row -->
    <section id="anime-row" class="content-row">
      <div class="row-header">
        <h2>Trending Anime</h2>
        <span class="see-all" onclick="openGridModal('anime')">See All</span>
      </div>
      <div id="anime-list" class="row-slider"></div>
    </section>

    <!-- Tagalog Movies Row -->
    <section id="tagalog-row" class="content-row">
      <div class="row-header">
        <h2>Trending Tagalog Movies</h2>
        <span class="see-all" onclick="openGridModal('tagalog')">See All</span>
      </div>
      <div id="tagalog-list" class="row-slider"></div>
    </section>

    <!-- K-Dramas Row -->
    <section id="kdrama-row" class="content-row">
      <div class="row-header">
        <h2>Trending K-Dramas</h2>
        <span class="see-all" onclick="openGridModal('kdrama')">See All</span>
      </div>
      <div id="kdrama-list" class="row-slider"></div>
    </section>

  </main>

  <!-- Video Details & Player Modal (Videasy Only, No Server Buttons) -->
  <div id="modal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <div class="modal-body">
        <!-- Video Player -->
        <div class="player-container">
          <iframe id="modal-video" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <!-- TV Series Season & Episode Selectors -->
        <div id="series-options" class="series-options" style="display: none;">
          <div class="season-selector-wrapper">
            <label for="season-select">Season:</label>
            <select id="season-select" onchange="onSeasonChange()"></select>
          </div>
          <div id="episodes-container" class="episodes-container"></div>
        </div>

        <!-- Movie/Show Info -->
        <div class="modal-info">
          <h1 id="modal-title"></h1>
          <div class="modal-meta">
            <span id="modal-rating" class="rating"></span>
          </div>
          <p id="modal-description"></p>
          <button id="watchlist-btn" class="watchlist-btn" onclick="toggleWatchlist()">Add to List</button>
        </div>
      </div>
    </div>
  </div>

  <!-- See All Grid Modal -->
  <div id="grid-modal" class="modal" style="display: none;">
    <div class="grid-modal-content">
      <span class="close-btn" onclick="closeGridModal()">&times;</span>
      <h2 id="grid-modal-title"></h2>
      <div id="grid-modal-results" class="grid-results-container"></div>
    </div>
  </div>

  <!-- Search Modal -->
  <div id="search-modal" class="modal" style="display: none;">
    <div class="search-modal-content">
      <span class="close-btn" onclick="closeSearchModal()">&times;</span>
      <input type="text" id="search-input" placeholder="Search movies, tv shows, anime..." oninput="debounceSearch()">
      <div id="search-results" class="search-results-grid"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast"></div>

  <script src="Home.js"></script>
</body>
</html>
