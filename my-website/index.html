<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Website</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="preload" href="css/home.css" as="style">
  <link rel="preload" href="js/home.js" as="script">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="js/home.js"></script>
</head>

<body>
  <div class="navbar">
    <a href="index.html">
      <img src="logo.png" alt="Website Logo" />
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <input type="text" class="search-bar" placeholder="Search..." readonly onclick="openSearchModal()" />
    </div>
  </div>

  <div class="banner" id="banner">
    <h1 id="banner-title"></h1>
  </div>

  <!-- CATEGORY FILTER TABS -->
  <div class="filter-tabs">
    <button class="tab-btn active" onclick="filterContent('all', this)">All</button>
    <button class="tab-btn" onclick="filterContent('movie', this)">Movies</button>
    <button class="tab-btn" onclick="filterContent('tv', this)">TV Shows</button>
    <button class="tab-btn" onclick="filterContent('anime', this)">Anime</button>
  </div>

  <!-- MY LIST ROW -->
  <div class="row" id="watchlist-row" style="display: none;">
    <h2>My List</h2>
    <div class="list" id="watchlist-list"></div>
  </div>

  <div class="row" id="movies-row">
    <h2>Trending Movies</h2>
    <div class="list" id="movies-list"></div>
  </div>

  <div class="row" id="tvshows-row">
    <h2>Trending TV Shows</h2>
    <div class="list" id="tvshows-list"></div>
  </div>

  <div class="row" id="anime-row">
    <h2>Trending Anime</h2>
    <div class="list" id="anime-list"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()" style="color: red;">&times;</span>
      <div class="modal-body">
        <img id="modal-image" src="" alt="" />
        <div class="modal-text">
          <h2 id="modal-title"></h2>
          <div class="stars" id="modal-rating"></div>
          <button id="watchlist-btn" class="watchlist-btn" onclick="toggleWatchlist()">Add to List</button>
          <p id="modal-description"></p>
        </div>
      </div>
      
      <div class="video-container">
        <iframe id="modal-video" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <div class="search-modal" id="search-modal">
    <span class="close" onclick="closeSearchModal()" style="color: red;">&times;</span>
    <input type="text" id="search-input" placeholder="Search for a movie or show..." oninput="debounceSearch()" />
    <div class="results" id="search-results"></div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2025 My Website. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Disclaimer</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
      </div>
    </div>
  </footer>

</body>
</html>
