<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamVault — Watch Movies & TV Shows</title>
  <link rel="stylesheet" href="css/home.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script defer src="js/home.js"></script>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="#" aria-label="StreamVault Home">
      <img src="logo.png" alt="StreamVault Logo" />
    </a>

    <nav class="nav-links">
      <a href="#" class="active" onclick="filterContent('all', this)">Home</a>
      <a href="#" onclick="filterContent('movie', this)">Movies</a>
      <a href="#" onclick="filterContent('tv', this)">TV Shows</a>
      <a href="#" onclick="filterContent('anime', this)">Anime</a>
      <a href="#" class="nav-badge-link" onclick="openGridModal('watchlist')">
        My List <span id="watchlist-badge" class="nav-badge" style="display: none;">0</span>
      </a>
    </nav>

    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="surprise-nav-btn" onclick="surpriseMe()" aria-label="Surprise Me">
        <i class="fa-solid fa-dice"></i>
        <span>Surprise</span>
      </button>

      <input 
        type="text" 
        class="search-bar" 
        placeholder="Search... (Press /)" 
        onclick="openSearchModal()" 
        readonly 
        aria-label="Search media"
      />
    </div>
  </header>

  <!-- MAIN BANNER -->
  <section id="banner" class="banner">
    <div class="banner-content">
      <h1 id="banner-title">Loading Featured...</h1>
      <div class="banner-btn-group">
        <button class="banner-btn" onclick="playBanner()">
          <i class="fa-solid fa-play"></i> Watch Now
        </button>
      </div>
    </div>
  </section>

  <!-- MAIN CONTENT CONTAINER -->
  <main>
    <!-- CONTINUE WATCHING ROW -->
    <section id="continue-row" class="row" style="display: none;">
      <div class="row-header">
        <h2>Continue Watching</h2>
        <button class="clear-btn" onclick="clearContinueWatching()">Clear All</button>
      </div>
      <div class="list-wrapper">
        <div id="continue-list" class="list"></div>
      </div>
    </section>

    <!-- WATCHLIST ROW -->
    <section id="watchlist-row" class="row" style="display: none;">
      <div class="row-header">
        <h2>My List</h2>
        <button class="clear-btn" onclick="clearWatchlist()">Clear All</button>
      </div>
      <div class="list-wrapper">
        <div id="watchlist-list" class="list"></div>
      </div>
    </section>

    <!-- TRENDING MOVIES -->
    <section id="movies-row" class="row">
      <div class="row-header">
        <h2>Trending Movies</h2>
        <button class="see-all-btn" onclick="openGridModal('movies')">See All</button>
      </div>
      <div class="list-wrapper">
        <button class="scroll-arrow left" onclick="scrollList('movies-list', -1)" aria-label="Scroll left"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="movies-list" class="list"></div>
        <button class="scroll-arrow right" onclick="scrollList('movies-list', 1)" aria-label="Scroll right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>

    <!-- TRENDING TV SHOWS -->
    <section id="tvshows-row" class="row">
      <div class="row-header">
        <h2>Trending TV Shows</h2>
        <button class="see-all-btn" onclick="openGridModal('tv')">See All</button>
      </div>
      <div class="list-wrapper">
        <button class="scroll-arrow left" onclick="scrollList('tvshows-list', -1)" aria-label="Scroll left"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="tvshows-list" class="list"></div>
        <button class="scroll-arrow right" onclick="scrollList('tvshows-list', 1)" aria-label="Scroll right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>

    <!-- ANIME ROW -->
    <section id="anime-row" class="row">
      <div class="row-header">
        <h2>Popular Anime</h2>
        <button class="see-all-btn" onclick="openGridModal('anime')">See All</button>
      </div>
      <div class="list-wrapper">
        <button class="scroll-arrow left" onclick="scrollList('anime-list', -1)" aria-label="Scroll left"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="anime-list" class="list"></div>
        <button class="scroll-arrow right" onclick="scrollList('anime-list', 1)" aria-label="Scroll right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>

    <!-- TAGALOG MOVIES -->
    <section id="tagalog-row" class="row">
      <div class="row-header">
        <h2>Filipino Cinema</h2>
        <button class="see-all-btn" onclick="openGridModal('tagalog')">See All</button>
      </div>
      <div class="list-wrapper">
        <button class="scroll-arrow left" onclick="scrollList('tagalog-list', -1)" aria-label="Scroll left"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="tagalog-list" class="list"></div>
        <button class="scroll-arrow right" onclick="scrollList('tagalog-list', 1)" aria-label="Scroll right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>

    <!-- K-DRAMA ROW -->
    <section id="kdrama-row" class="row">
      <div class="row-header">
        <h2>Korean Dramas</h2>
        <button class="see-all-btn" onclick="openGridModal('kdrama')">See All</button>
      </div>
      <div class="list-wrapper">
        <button class="scroll-arrow left" onclick="scrollList('kdrama-list', -1)" aria-label="Scroll left"><i class="fa-solid fa-chevron-left"></i></button>
        <div id="kdrama-list" class="list"></div>
        <button class="scroll-arrow right" onclick="scrollList('kdrama-list', 1)" aria-label="Scroll right"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </section>
  </main>

  <!-- DETAILS MODAL -->
  <div id="modal" class="modal" role="dialog" aria-hidden="true">
    <div class="modal-content">
      <button class="close" onclick="closeModal()" aria-label="Close modal">&times;</button>
      <div class="modal-body">
        <img id="modal-image" src="" alt="Poster" />
        <div class="modal-text">
          <h2 id="modal-title"></h2>
          <div id="modal-rating" class="stars"></div>
          <p id="modal-description"></p>
          
          <div class="modal-actions-inline">
            <button id="watchlist-btn" class="watchlist-btn" onclick="toggleWatchlist()">Add to List</button>
            <button class="share-btn" onclick="shareCurrentItem()"><i class="fa-solid fa-share"></i> Share</button>
          </div>

          <div id="series-options" class="series-options" style="display: none;">
            <div class="select-wrapper">
              <label for="season-select">Season:</label>
              <select id="season-select" onchange="onSeasonChange()"></select>
            </div>
            <div id="episodes-container" class="episodes-container"></div>
          </div>

          <div class="server-switcher">
            <span>Server:</span>
            <button class="server-btn active" data-server="videasy" onclick="switchServer('videasy')">Server 1</button>
            <button class="server-btn" data-server="vidsrc" onclick="switchServer('vidsrc')">Server 2</button>
            <button class="server-btn" data-server="vidsrcpro" onclick="switchServer('vidsrcpro')">Server 3</button>
          </div>
        </div>
      </div>

      <!-- PLAYER CONTAINER & INLINE CONTROLS -->
      <div class="player-wrapper">
        <div id="player-container" class="video-container">
          <iframe id="modal-video" src="about:blank" allowfullscreen title="Video Player"></iframe>
        </div>

        <div id="player-quick-controls" class="player-quick-controls" style="display: none;">
          <button class="quick-btn" onclick="skipIntro()">
            <i class="fa-solid fa-forward-step"></i> Skip Intro (+85s)
          </button>
          <button class="quick-btn primary" onclick="playNextEpisode()">
            <span>Next Episode</span> <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- TRAILER AND CAST CONTAINER -->
      <div id="modal-trailer-container"></div>
      <div id="modal-cast-container"></div>
    </div>
  </div>

  <!-- SEE ALL GRID MODAL -->
  <div id="grid-modal" class="grid-modal" role="dialog" aria-hidden="true">
    <button class="close" onclick="closeGridModal()" aria-label="Close Modal">&times;</button>
    <div class="grid-header">
      <h2 id="grid-modal-title">Category Details</h2>
      <div id="genre-tabs" class="genre-tabs"></div>
    </div>
    <div id="grid-scroll-area" class="grid-scroll-area">
      <div id="grid-modal-results" class="grid-container"></div>
    </div>
  </div>

  <!-- SEARCH MODAL -->
  <div id="search-modal" class="search-modal" role="dialog" aria-hidden="true">
    <button class="close" onclick="closeSearchModal()" aria-label="Close Search">&times;</button>
    <div class="search-input-wrapper">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Type movie or show name..." 
        oninput="debounceSearch()" 
        aria-label="Search Input"
      />
    </div>
    <div id="search-results" class="results"></div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 StreamVault. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
