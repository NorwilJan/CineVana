<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drama Vault | Stream Korean Dramas</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Home.css">
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Navigation Bar -->
        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-film"></i> K-Drama<span>Vault</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search K-Dramas...">
                <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </header>

        <!-- Main Content Grid / Catalog -->
        <main class="main-container">
            <section class="hero-banner">
                <h1>Unlimited Korean Dramas</h1>
                <p>Stream your favorite romance, thriller, and historical K-dramas instantly.</p>
            </section>

            <h2 class="section-title">Trending K-Dramas</h2>
            <div id="mediaGrid" class="media-grid">
                <!-- Dynamic cards populated via JavaScript -->
            </div>
        </main>

        <!-- Video Watch Modal / Player Overlay -->
        <div id="playerModal" class="modal hidden">
            <div class="modal-content">
                <button class="close-modal" id="closeModalBtn">&times;</button>
                <h2 id="modalTitle">Drama Title</h2>
                
                <!-- Player View -->
                <div class="player-wrapper">
                    <iframe id="videoPlayerIframe" src="" frameborder="0" allowfullscreen></iframe>
                </div>

                <!-- Server Switcher -->
                <div class="server-selector">
                    <span>Servers:</span>
                    <button class="server-btn active" onclick="switchServer(1)">Server 1 (Primary)</button>
                    <button class="server-btn" onclick="switchServer(2)">Server 2 (Backup)</button>
                    <button class="server-btn" onclick="switchServer(3)">Server 3 (Alt)</button>
                </div>

                <!-- Season & Episode Controls -->
                <div class="episode-controls">
                    <div class="control-group">
                        <label for="seasonSelect">Season:</label>
                        <select id="seasonSelect" onchange="handleSeasonChange()">
                            <option value="1">Season 1</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="episodeSelect">Episode:</label>
                        <select id="episodeSelect" onchange="handleEpisodeChange()">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main JS Application Logic -->
    <script src="Home.js"></script>
</body>
</html>
